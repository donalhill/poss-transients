[project]
name = "poss-transients"
version = "1.0.0"
description = "A re-examination of VASCO's claims about transients on the 1950s Palomar Sky Survey plates"
requires-python = ">=3.12"
# the versions the published page was built with
dependencies = [
    "astropy==8.0.2",
    "astroquery==0.4.11",
    "matplotlib==3.11.2",
    "numba==0.68.0",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "photutils==3.1.1",
    "pyarrow==26.0.0",
    "requests==2.34.2",
    "scipy==1.18.1",
    "statsmodels==0.15.0",
]

[tool.setuptools]
packages = []
